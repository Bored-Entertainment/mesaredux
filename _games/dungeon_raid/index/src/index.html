<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | DungeonRaid</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
        <style>
        @font-face {
        font-family: Seraphim;
        src: url('/assets/Seraphimb1.ttf');
        }
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            font-family: "Seraphim";
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            color: #fff;
            transition: opacity 300ms ease;

        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
        }

        .loading-card {
            width: min(420px, 90vw);
            padding: 32px 28px;
            background-color: #070707;
            border: 1px solid #ff4500;            
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .loading-logo {
            width: 180px;
            max-width: 60%;
            margin: 0 auto 8px;
            display: block;
        }

        .loading-title {
            font-size: 1.2rem;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .loading-detail {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
            min-height: 1.4em;
        }

        .loading-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff4500, #ff7b00);
            transition: width 120ms ease-out;
        }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
        <div class="loading-card">
            <img src="/assets/images/banner.png" alt="mesaredux" class="loading-logo">
            <div id="loading-status" class="loading-title">preparing download</div>
            <div class="loading-detail" id="loading-detail">requesting source files…</div>
            <div class="loading-track">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
        </div>
    </div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1000 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      
      var overlay = document.querySelector("#loading-overlay");
      var overlayStatus = document.querySelector("#loading-status");
      var overlayDetail = document.querySelector("#loading-detail");
      var overlayProgress = document.querySelector("#loading-progress");
      var overlayPhase = "remote";

      var remotePartsLoaded = 0;

      function clamp01(value) {
          return Math.min(1, Math.max(0, value));
      }

      function updateOverlay(statusText, progressValue, detailText) {
          if (statusText) {
              overlayStatus.textContent = statusText;
          }
          if (typeof progressValue === "number") {
              overlayProgress.style.width = (clamp01(progressValue) * 100) + "%";
          }
          if (typeof detailText === "string") {
              overlayDetail.textContent = detailText;
          }
      }

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/DungeonRaid.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/DungeonRaid.data.unityweb",
        frameworkUrl: buildUrl + "/DungeonRaid.framework.js.unityweb",
        codeUrl: buildUrl + "/DungeonRaid.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FourCats",
        productName: "DungeonRaid",
        productVersion: "1.0.0.89",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "none";
      overlayPhase = "unity";
      updateOverlay("Loading game", 0, "Initializing engine… [Game may take a long time to load]");
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
          if (overlayPhase === "unity") {
                        updateOverlay("Loading game", progress, Math.round(progress * 100) + "% complete [Game may take a long time to load]");
                    }
        }).then((unityInstance) => {
          overlayPhase = "done";
                    overlay.classList.add("hidden");
                    setTimeout(() => overlay.remove(), 350);
        }).catch((message) => {
          overlayPhase = "error";
          updateOverlay("Load error", 1, message);
          overlay.classList.remove("hidden");
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
