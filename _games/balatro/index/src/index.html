<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <body>
    <style>
      .element::-webkit-scrollbar {
          display: none;
      }
      html {
          scrollbar-width: none;
      }
    </style>
    <style>
        @font-face {
        font-family: Seraphim;
        src: url('/assets/Seraphimb1.ttf');
        }
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            font-family: "Seraphim";
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            color: #fff;
            transition: opacity 300ms ease;

        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
        }

        .loading-card {
            width: min(420px, 90vw);
            padding: 32px 28px;
            background-color: #070707;
            border: 1px solid #ff4500;            
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .loading-logo {
            width: 180px;
            max-width: 60%;
            margin: 0 auto 8px;
            display: block;
        }

        .loading-title {
            font-size: 1.2rem;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .loading-detail {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
            min-height: 1.4em;
        }

        .loading-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff4500, #ff7b00);
            transition: width 120ms ease-out;
        }
    </style>

    <center>
      <div>
        <!-- <h1>Balatro</h1> -->
      <div id="loading-overlay">
          <div class="loading-card">
              <img src="/assets/images/banner.png" alt="mesaredux" class="loading-logo">
              <div id="loading-status" class="loading-title">preparing download</div>
              <div class="loading-detail" id="loading-detail">requesting source files…</div>
              <div class="loading-track">
                  <div class="loading-progress" id="loading-progress"></div>
              </div>
          </div>
      </div>        
      <canvas id="canvas" width="550" height="310"></canvas>
      </div>
    </center>

    <script type='text/javascript'>
        window.callad = () => {
            window.parent.postMessage({ type: 'adcall'}, '*');
        }
var overlay = document.querySelector("#loading-overlay");
      var overlayStatus = document.querySelector("#loading-status");
      var overlayDetail = document.querySelector("#loading-detail");
      var overlayProgress = document.querySelector("#loading-progress");
      var overlayPhase = "remote";

      var remotePartsLoaded = 0;

      function clamp01(value) {
          return Math.min(1, Math.max(0, value));
      }

      function updateOverlay(statusText, progressValue, detailText) {
          if (statusText) {
              overlayStatus.textContent = statusText;
          }
          if (typeof progressValue === "number") {
              overlayProgress.style.width = (clamp01(progressValue) * 100) + "%";
          }
          if (typeof detailText === "string") {
              overlayDetail.textContent = detailText;
          }
      }      
      canvas.width = 550;
      canvas.height = 310;
      function goFullScreen(){
            var canvas = document.getElementById("canvas");
            if(canvas.requestFullScreen)
                canvas.requestFullScreen();
            else if(canvas.webkitRequestFullScreen)
                canvas.webkitRequestFullScreen();
            else if(canvas.mozRequestFullScreen)
                canvas.mozRequestFullScreen();
      }
      function FullScreenHook(){
        var canvas = document.getElementById("canvas");
        canvas.width = 550;
        canvas.height = 310;
      }

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      window.addEventListener("keydown", function(e) {
        // space and arrow keys
        if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
          e.preventDefault();
        }
      }, false);
      overlayPhase = "unity";
      updateOverlay("Loading game", 0, "Initializing lovejs… [Game may take a long time to load]");
      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 256000000,
        printErr: console.error.bind(console),
        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          if (overlayPhase === "unity") {
                        updateOverlay("Loading game", totalDependencies, Math.round(remainingDependencies/totalDependencies * 100) + "% complete [Game may take a long time to load]");
          }
        }
      };
      window.onerror = function(event) {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
          overlayPhase = "error";
          updateOverlay("Load error", 1, message);
          overlay.classList.remove("hidden");
      };

      var applicationLoad = function(e) {
        overlayPhase = "done";
        overlay.classList.add("hidden");
        Love(Module);
      }
    </script>
    <script type="text/javascript" src="game.js"></script>
    <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>

    </footer> -->
  </body>
</html>
