		function GameFileSaved(filename, encoded_data) {

			"filename": filename.split('/').at(-1),

		});

		var dataFilesList =

	function CountRemoteDataFiles() {

	function updateFilesListUI() {
		var element = document.getElementById('data_files_list');
		if (dataFilesList.length == 0 && lastSavingError == null) {
			element.style.display = 'none';
			element.innerHTML = '';
			return;
		}

		element.style.display = null;

		var html = "";
		if (lastSavingError != null) {
			html = "<h2 class='warning'>Warning: " + lastSavingError + "</h2>";
		}

		if (dataFilesList.length == 0) {
			element.innerHTML = html;
			return;
		}

		html += "<h2>Downloadable data files:</h2>";
		html += "<p>Since you are not logged in, these files will become unavailable as soon as you leave this page!</p>";
		dataFilesList.forEach(object => {
			if (object.download_link != null) {
				html += "<a class='playonline_download_entry' href='" + object.download_link + "'>";
			} else {
				html += "<div class='playonline_download_entry' onclick='localDownload(\"" + object.filename + "\", \"" + object.data + "\")'>";
			}

			html += "<p>" + object.filename + "</p>";
			html += "<p>" + object.timestamp + "</p>";
			html += "<p>" + object.filesize + "</p>";

			if (object.download_link != null) {
				html += "</a>";
			} else {
				html += "</div>";
			}
		});

		element.innerHTML = html;
	}

	function localDownload(filename, encoded_data) {
		const bufferLen = encoded_data.length / 2;
		var buffer = new Uint8Array(bufferLen);
		const substUpper = 'A'.charCodeAt(0);
		const substLower = 'a'.charCodeAt(0);

		for (var i = 0; i < bufferLen; ++i) {
			var upper = encoded_data.charCodeAt(2 * i    ) - substUpper;
			var lower = encoded_data.charCodeAt(2 * i + 1) - substLower;
			buffer[i] = (upper << 4) | lower;
		}

		var blob = new Blob([buffer], {"type": "application/octet-stream"});
		var url = window.URL.createObjectURL(blob);
		var a = document.createElement("a");
		document.body.appendChild(a);
		a.style = "display: none";
		a.href = url;
		a.download = filename;
		a.click();
		window.URL.revokeObjectURL(url);
	}

	updateFilesListUI();

	</script>
