<!doctype html>
<html lang="en-us">
 
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | AdVenture Capitalist!</title>
    <style>
        @font-face {
        font-family: Seraphim;
        src: url('/assets/Seraphimb1.ttf');
        }
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            font-family: "Seraphim";
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            color: #fff;
            transition: opacity 300ms ease;

        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
        }

        .loading-card {
            width: min(420px, 90vw);
            padding: 32px 28px;
            background-color: #070707;
            border: 1px solid #ff4500;            
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .loading-logo {
            width: 180px;
            max-width: 60%;
            margin: 0 auto 8px;
            display: block;
        }

        .loading-title {
            font-size: 1.2rem;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .loading-detail {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
            min-height: 1.4em;
        }

        .loading-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff4500, #ff7b00);
            transition: width 120ms ease-out;
        }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
</head>
 
<body class="template">
    <div id="loading-overlay">
        <div class="loading-card">
            <img src="/assets/images/banner.png" alt="mesaredux" class="loading-logo">
            <div id="loading-status" class="loading-title">preparing download</div>
            <div class="loading-detail" id="loading-detail">requesting source files…</div>
            <div class="loading-track">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
        </div>
    </div>
    <div class="webgl-content">
        <div id="unityContainer" style="width: 960px; height: 600px; padding: 0px; margin: 0px; border: 0px; position: relative; background: rgb(35, 31, 32);">
          
      <canvas  class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" id="canvas"width=335 height=667 style="width: 100%; height: 100%; background: #231F20"></canvas>
      
    
    <script type='text/javascript'>
            
        var overlay = document.querySelector("#loading-overlay");
        var overlayStatus = document.querySelector("#loading-status");
        var overlayDetail = document.querySelector("#loading-detail");
        var overlayProgress = document.querySelector("#loading-progress");
        var overlayPhase = "remote";

        var remotePartsLoaded = 0;

        function clamp01(value) {
            return Math.min(1, Math.max(0, value));
        }

        function updateOverlay(statusText, progressValue, detailText) {
            if (statusText) {
                overlayStatus.textContent = statusText;
            }
            if (typeof progressValue === "number") {
                overlayProgress.style.width = (clamp01(progressValue) * 100) + "%";
            }
            if (typeof detailText === "string") {
                overlayDetail.textContent = detailText;
            }
        }
        // connect to canvas
        overlayPhase = "unity";
        updateOverlay("Loading game", 0, "Initializing engine… [Game may take a long time to load]");
        var Module = {
            TOTAL_MEMORY: 201326592,
            filePackagePrefixURL: "Release/",
            memoryInitializerPrefixURL: "Release/",
            preRun: [],
            postRun: [],
            print: (function() {
                return function(text) {
                    console.log(text);
                };
            })(),
            printErr: function(text) {
                console.error(text);
            },
            canvas: document.getElementById('canvas'),
            progress: null,
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                updateOverlay(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };
        updateOverlay('Downloading (0.0/1)');
    </script>
    <script src="Release/UnityConfig.js"></script>
    <script src="Release/fileloader.js"></script>
    <script>
        if (!(!Math.fround)) {
            var script = document.createElement('script');
            script.src = "Release/webgl.js";
            document.body.appendChild(script);
        } else {
            var codeXHR = new XMLHttpRequest();
            codeXHR.open('GET', 'Release/webgl.js', true);
            codeXHR.onload = function() {
                var code = codeXHR.responseText;
                if (!Math.fround) {
                    try {
                        console.log('optimizing out Math.fround calls');
                        var m = /var ([^=]+)=global\.Math\.fround;/.exec(code);
                        var minified = m[1];
                        if (!minified) throw 'fail';
                        var startAsm = code.indexOf('// EMSCRIPTEN_START_FUNCS');
                        var endAsm = code.indexOf('// EMSCRIPTEN_END_FUNCS');
                        var asm = code.substring(startAsm, endAsm);
                        do {
                            var moar = false; // we need to re-do, as x(x( will not be fixed
                            asm = asm.replace(new RegExp('[^a-zA-Z0-9\\$\\_]' + minified + '\\(', 'g'), function(s) {
                                moar = true;
                                return s[0] + '('
                            });
                        } while (moar);
                        code = code.substring(0, startAsm) + asm + code.substring(endAsm);
                        code = code.replace("'use asm'", "'almost asm'");
                    } catch (e) {
                        console.log('failed to optimize out Math.fround calls ' + e)
                    }
                }
                var blob = new Blob([code], {
                    type: 'text/javascript'
                });
                codeXHR = null;
                var src = URL.createObjectURL(blob);
                var script = document.createElement('script');
                script.src = URL.createObjectURL(blob);
                script.onload = function() {
                    URL.revokeObjectURL(script.src);
                };
                document.body.appendChild(script);
            };
            codeXHR.send(null);
        }
        overlay.classList.add("hidden");
    </script>
</body>
 
</html>
