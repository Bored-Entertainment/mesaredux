<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | People Playground</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        @font-face {
        font-family: Seraphim;
        src: url('/assets/Seraphimb1.ttf');
        }
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            font-family: "Seraphim";
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            color: #fff;
            transition: opacity 300ms ease;

        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
        }

        .loading-card {
            width: min(420px, 90vw);
            padding: 32px 28px;
            background-color: #070707;
            border: 1px solid #ff4500;            
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .loading-logo {
            width: 180px;
            max-width: 60%;
            margin: 0 auto 8px;
            display: block;
        }

        .loading-title {
            font-size: 1.2rem;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .loading-detail {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
            min-height: 1.4em;
        }

        .loading-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff4500, #ff7b00);
            transition: width 120ms ease-out;
        }
    </style>
</head>

<body>
    <div id="loading-overlay">
        <div class="loading-card">
            <img src="/assets/images/banner.png" alt="mesaredux" class="loading-logo">
            <div id="loading-status" class="loading-title">preparing download</div>
            <div class="loading-detail" id="loading-detail">requesting source files…</div>
            <div class="loading-track">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
        </div>
    </div>
    <div id="unity-container" class="unity-desktop" hidden>
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
    </div>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        var overlay = document.querySelector("#loading-overlay");
        var overlayStatus = document.querySelector("#loading-status");
        var overlayDetail = document.querySelector("#loading-detail");
        var overlayProgress = document.querySelector("#loading-progress");
        var overlayPhase = "remote";

        var STORAGE_REQUEST_ENDPOINT = "https://storage.mesaredux.com/?requestFile=";
        var REMOTE_BASE_PATH = "mesaredux/unity/ppg/";
        var remotePartsLoaded = 0;

        function clamp01(value) {
            return Math.min(1, Math.max(0, value));
        }

        function updateOverlay(statusText, progressValue, detailText) {
            if (statusText) {
                overlayStatus.textContent = statusText;
            }
            if (typeof progressValue === "number") {
                overlayProgress.style.width = (clamp01(progressValue) * 100) + "%";
            }
            if (typeof detailText === "string") {
                overlayDetail.textContent = detailText;
            }
        }

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        function fetchSignedUrl(remotePath) {
            return fetch(STORAGE_REQUEST_ENDPOINT + encodeURIComponent(remotePath)).then((response) => {
                if (!response.ok) {
                    throw new Error("Failed to request signed URL for " + remotePath);
                }
                return response.json();
            }).then((body) => {
                if (!body.url) {
                    throw new Error("Signed URL missing for " + remotePath);
                }
                return body.url;
            });
        }

        function fetchRemotePart(remotePath) {
            return fetchSignedUrl(remotePath).then((signedUrl) => fetch(signedUrl)).then((response) => {
                if (!response.ok) {
                    throw new Error("Failed to download part " + remotePath);
                }
                return response.arrayBuffer();
            });
        }

        function mergeFiles(fileParts, onPartComplete) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetchRemotePart(fileParts[index]).then((data) => {
                        buffers.push(data);
                        if (typeof onPartComplete === "function") {
                            onPartComplete(index + 1, fileParts.length);
                        }
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        function handleRemotePartComplete() {
            remotePartsLoaded++;
            updateOverlay(
                "downloading source",
                remotePartsLoaded / TOTAL_REMOTE_PARTS,
                "fetched part " + remotePartsLoaded + " / " + TOTAL_REMOTE_PARTS
            );
        }

        var wasmParts = getParts(REMOTE_BASE_PATH + "PPG.wasm", 1, 3);
        var dataParts = getParts(REMOTE_BASE_PATH + "PPG.data", 1, 6);
        var TOTAL_REMOTE_PARTS = wasmParts.length + dataParts.length;

        Promise.all([
            mergeFiles(wasmParts, handleRemotePartComplete),
            mergeFiles(dataParts, handleRemotePartComplete)
        ]).then(([wasmUrl, dataUrl]) => {
            container.hidden = false;
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/PPG.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/PPG.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Studio Minus",
                productName: "People Playground",
                productVersion: "0"
            };
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                var meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                document.getElementsByTagName('head')[0].appendChild(meta);
                container.className = "unity-mobile";
                canvas.className = "unity-mobile";
            } else {
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }
            loadingBar.style.display = "none";
            overlayPhase = "unity";
            updateOverlay("Loading game", 0, "Initializing engine…");
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                    if (overlayPhase === "unity") {
                        updateOverlay("Loading game", progress, Math.round(progress * 100) + "% complete");
                    }
                }).then((unityInstance) => {
                    overlayPhase = "done";
                    overlay.classList.add("hidden");
                    setTimeout(() => overlay.remove(), 350);
                }).catch((message) => {
                    overlayPhase = "error";
                    updateOverlay("Load error", 1, message);
                    overlay.classList.remove("hidden");
                    alert(message);
                });
            };
            document.body.appendChild(script);
        }).catch((error) => {
            overlayPhase = "error";
            updateOverlay("Download failed", 1, error.message || error);
            alert(error.message || error);
        });
    </script>
</body>

</html>
