url: "https://mesaredux.com" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
domain: "mesaredux.com"
title: "MESλREDUX" # the name of your site, e.g. ACME Corp.
excerpt_separator: <!--ex-->
repository: Bored-Entertainment/mesaredux

collections:
  games:
    output: true
    permalink: /games/:path/

compress_images:
  images_path:
    - "**/*.{png,jpg,jpeg,svg,gif}"
    - "!assets/images/**"
    - "assets/images/ubgu-member.svg"
    - "assets/images/placeholder.png"
    - "assets/images/badges/**/*.{png,jpg,jpeg,svg,gif}"
    - "assets/images/rss_ani.gif"

imageoptim:
  gifsicle:
    level: 3
  jpegoptim:
    strip: "all"
  jpegtran: true
  oxipng: 
    level: 6
  advpng: 
    level: 4
  optipng:
    level: 7
    strip: true
  pngcrush :
    brute: false
    blacken: false
    chunks: "allb"
  svgo: 
    allow_lossy: false
  allow_lossy: false


plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-minifier
  - jekyll-compress-images

exclude:
  - "vendor"
  - ".bundle"
  - "Gemfile"
  - "Gemfile.lock"
  - ".github"
  - "README.md"
  - "LICENSE"
  - "node_modules"
  - "package.json"
  - "package-lock.json"

jekyll-minifier:
  exclude:
    - "games/**/index/src/**"
  compress_css: true
  compress_javascript: true
  compress_json: true    
  compress_html: true
  preserve_line_breaks: false
  remove_comments: true
